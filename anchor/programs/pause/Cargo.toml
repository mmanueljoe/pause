[package]
name = "pause"
version = "0.1.0"
description = "Pause: a Solana vault where every withdrawal waits, so the owner or a guardian can stop it"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "pause"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"

[dev-dependencies]
litesvm = "0.16.0"
solana-sdk = "4.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

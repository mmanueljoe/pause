name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOLANA_VERSION: "3.1.10"
  ANCHOR_VERSION: "1.1.2"

jobs:
  website:
    name: Website (types, lint, format, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  program:
    name: Program (fmt, clippy, build, test, client in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust toolchain (from anchor/rust-toolchain.toml)
        working-directory: anchor
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: anchor

      - name: Cache Solana and Anchor CLIs
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cargo/bin/anchor
          key: cli-${{ runner.os }}-solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}

      - name: Install Solana CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"

      - name: Install Anchor CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: cargo install anchor-cli --version "${ANCHOR_VERSION}" --locked

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - run: npm ci
      - run: npm run program:lint
      - run: npm run program:test

      - name: Check the generated client matches the program
        run: |
          npm run codegen
          git diff --exit-code src/generated || {
            echo "::error::src/generated is out of date. Run 'npm run setup' and commit the result."
            exit 1
          }

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --redact --verbose
